<html lang="zh-CN"><head><meta charset="utf-8"><title>方案 A2 · 逐步引导（修订）</title>

<style>/* Tokens copied verbatim from src/renderer/style.css (light + dark). Dark is switched by attribute here so screenshots are deterministic. */
:root {
  --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "Microsoft YaHei UI", "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --fs-cap: 11px; --fs-sm: 12px; --fs-body: 13px; --fs-title: 14px; --fs-page: 22px;
  --fw-label: 500; --fw-title: 600; --fw-page: 650; --lh: 1.45;
  --r-sm: 4px; --r-ctl: 8px; --r-tab: 10px; --r-card: 10px; --r-pop: 14px; --r-dlg: 14px; --r-pill: 999px;
  --h-ctl: 28px; --h-field: 34px;
  --dur-fast: 120ms; --dur: 160ms; --dur-page: 180ms;
  --ease-out: cubic-bezier(.2, 0, 0, 1); --ease-in-out: cubic-bezier(.4, 0, .2, 1);
  --frame: #e5e6e8; --frame-hover: #dadbdd; --frame-press: #cfd0d3; --frame-raised: #ffffff;
  --field: #eeeff1; --surface: #ffffff; --sunken: #f4f5f6; --band: #f4f5f6; --band-field: #e6e7e9;
  --pop: #f3f4f5; --pop-hover: rgb(27 28 30 / .065);
  --text: #1b1c1e; --text-2: #5a5b5f; --text-3: #77797d;
  --sep: rgb(27 28 30 / .11); --line-strong: rgb(27 28 30 / .2); --line-control: rgb(27 28 30 / .5);
  --hover: rgb(27 28 30 / .045); --press: rgb(27 28 30 / .085);
  --accent: #0b7479; --accent-fill: var(--accent); --on-accent: #fff;
  --accent-fill-hover: color-mix(in oklab, var(--accent-fill) 90%, #000);
  --accent-fill-press: color-mix(in oklab, var(--accent-fill) 80%, #000);
  --accent-soft: color-mix(in srgb, var(--accent) 12%, transparent);
  --ok: #17773f; --warn: #94590a; --danger: #c2352b; --danger-fill: #c2352b; --idle: #7e8084;
  --focus-ring: 1.5px solid var(--accent); --focus-offset: -1.5px;
  --shadow-sheet: 0 0 0 1px rgb(27 28 30 / .07), 0 1px 2px rgb(27 28 30 / .06), 0 10px 28px -10px rgb(27 28 30 / .18);
  --shadow-raised: 0 0 0 1px rgb(27 28 30 / .06), 0 1px 2px rgb(27 28 30 / .1);
  --shadow-ctl: 0 1px 1px rgb(27 28 30 / .05);
  --shadow-pop: 0 0 0 1px rgb(27 28 30 / .09), 0 4px 10px -2px rgb(27 28 30 / .08), 0 22px 48px -12px rgb(27 28 30 / .3);
  --mock-bg: #d4d5d8;
  color-scheme: light;
  font: var(--fs-body)/var(--lh) var(--font);
  -webkit-font-smoothing: antialiased;
}
:root[data-theme=dark] {
  --frame: #121213; --frame-hover: #1e1e20; --frame-press: #262628; --frame-raised: #2c2c2e;
  --field: #1e1e20; --surface: #232325; --sunken: #1b1b1d; --band: #1c1c1e; --band-field: #121213;
  --pop: #1e1e20; --pop-hover: #2c2c2e;
  --text: #ececed; --text-2: #a6a7aa; --text-3: #76777a;
  --sep: rgb(255 255 255 / .09); --line-strong: rgb(255 255 255 / .16); --line-control: rgb(255 255 255 / .38);
  --hover: rgb(255 255 255 / .05); --press: rgb(255 255 255 / .09);
  --accent: #4fc4c1; --accent-fill: oklch(from var(--accent) .52 calc(c * .9) h);
  --accent-fill-hover: color-mix(in oklab, var(--accent-fill) 94%, #fff);
  --accent-fill-press: color-mix(in oklab, var(--accent-fill) 85%, #000);
  --accent-soft: color-mix(in srgb, var(--accent) 18%, transparent);
  --ok: #52c985; --warn: #e0a030; --danger: #ff6a5e; --danger-fill: #c4382e; --idle: #8b8c8f;
  --shadow-sheet: 0 0 0 1px rgb(255 255 255 / .06), 0 16px 40px -16px rgb(0 0 0 / .9);
  --shadow-raised: inset 0 1px 0 rgb(255 255 255 / .05);
  --shadow-ctl: 0 1px 1px rgb(0 0 0 / .2);
  --shadow-pop: 0 0 0 1px rgb(255 255 255 / .09), 0 20px 50px -10px rgb(0 0 0 / .8);
  --mock-bg: #0b0b0c;
  color-scheme: dark;
}
@media (prefers-reduced-motion: reduce) { :root { --dur-fast: 0ms; --dur: 0ms; --dur-page: 0ms; } }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; color: var(--text); }
svg.icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
p { margin: 0; }

/* Base controls, as in style.css */
button { font: inherit; color: inherit; background: none; border: 0; border-radius: var(--r-ctl); padding: 0; cursor: default; transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out); }
button:disabled { opacity: .45; }
button:focus-visible, a:focus-visible { outline: var(--focus-ring); outline-offset: var(--focus-offset); }
.icon-btn { width: 30px; height: 30px; display: inline-grid; place-items: center; color: var(--text-2); }
.icon-btn:hover:not(:disabled) { background: var(--hover); color: var(--text); }
.btn { height: 28px; padding: 0 12px; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; font-weight: var(--fw-label); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-strong), var(--shadow-ctl); }
.btn:hover:not(:disabled) { background: color-mix(in srgb, var(--surface) 94%, var(--text)); }
.btn:active:not(:disabled) { background: color-mix(in srgb, var(--surface) 88%, var(--text)); }
.btn.primary { background: var(--accent-fill); color: var(--on-accent); box-shadow: none; }
.btn.primary:hover:not(:disabled) { background: var(--accent-fill-hover); }
.btn.primary:active:not(:disabled) { background: var(--accent-fill-press); }
.btn.link { padding: 0 4px; background: transparent; box-shadow: none; color: var(--accent); }
.btn.link:hover:not(:disabled) { background: var(--hover); }
.btn.quiet { background: transparent; box-shadow: none; color: var(--text-2); }
.btn.quiet:hover:not(:disabled) { background: var(--hover); color: var(--text); }
.btn.lg { height: 32px; padding: 0 16px; }
.btn svg.icon { width: 15px; height: 15px; }
input, select, textarea { font: inherit; color: inherit; background: var(--surface); border: 0; box-shadow: inset 0 0 0 1px var(--line-strong), var(--shadow-ctl); border-radius: var(--r-ctl); padding: 0 10px; height: 28px; accent-color: var(--accent-fill); transition: box-shadow var(--dur-fast) var(--ease-out); }
input::placeholder, textarea::placeholder { color: var(--text-3); }
input:hover:not(:disabled), select:hover:not(:disabled), textarea:hover:not(:disabled) { box-shadow: inset 0 0 0 1px var(--line-control), var(--shadow-ctl); }
textarea { height: auto; padding: 8px 10px; font: var(--fs-sm)/1.5 var(--mono); resize: vertical; }
select { appearance: none; min-width: 148px; padding: 0 36px 0 12px; background: linear-gradient(45deg, transparent calc(50% - .75px), var(--text-2) calc(50% - .75px) calc(50% + .75px), transparent calc(50% + .75px)) right 17px center / 5px 5px no-repeat, linear-gradient(-45deg, transparent calc(50% - .75px), var(--text-2) calc(50% - .75px) calc(50% + .75px), transparent calc(50% + .75px)) right 12px center / 5px 5px no-repeat, var(--surface); }
input:focus, textarea:focus, select:focus-visible { outline: var(--focus-ring); outline-offset: var(--focus-offset); }
input[type=radio] { appearance: none; position: relative; width: 16px; height: 16px; padding: 0; flex: none; margin: 0; border-radius: 50%; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-control), var(--shadow-ctl); }
input[type=radio]:checked { background: var(--on-accent); box-shadow: inset 0 0 0 5px var(--accent-fill); }
input[type=radio]:focus { outline: none; }
input[type=radio]:focus-visible, .btn.primary:focus-visible { outline: var(--focus-ring); outline-offset: 1px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; background: var(--idle); }
.dot.open { background: var(--ok); } .dot.closed { background: var(--danger); }
.dot.checking { background: var(--warn); animation: breathe 1.4s var(--ease-in-out) infinite; }
@keyframes breathe { 50% { opacity: .35; } }
body.shot .dot.checking { animation: none; }
.mono { font-family: var(--mono); font-size: var(--fs-sm); }
.t2 { color: var(--text-2); } .t3 { color: var(--text-3); } .sm { font-size: var(--fs-sm); }

/* ---------- Mockup harness (not product UI) ---------- */
body.mock { background: var(--mock-bg); padding: 60px 24px 32px; min-height: 100vh; }
.mockbar { position: fixed; z-index: 50; inset: 0 0 auto 0; height: 44px; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: #fbfbfb; color: #1b1c1e; border-bottom: 1px solid #d0d0d3; font: 12px/1.3 var(--font); color-scheme: light; overflow-x: auto; white-space: nowrap; }
.mockbar b { font-weight: 600; } .mockbar a { color: #0b7479; }
.mockbar label { display: inline-flex; align-items: center; gap: 6px; color: #5a5b5f; }
.mockbar select { height: 24px; min-width: 0; font-size: 12px; background-color: #fff; color: #1b1c1e; }
body.shot { padding: 0; background: var(--surface); }
body.shot .mockbar { display: none; }

/* ---------- Window frame ---------- */
.win { position: relative; width: var(--w, 1280px); height: var(--h, 800px); margin: 0 auto; background: var(--surface); border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px rgb(0 0 0 / .18), 0 30px 70px -20px rgb(0 0 0 / .45); display: flex; flex-direction: column; }
body.shot .win { width: 100vw; height: 100vh; border-radius: 0; box-shadow: none; }
.win.mac { --inset-l: 76px; --inset-r: 0px; }
.win.winos { --inset-l: 0px; --inset-r: 138px; border-radius: 0; }
.lights { position: absolute; z-index: 20; left: 19px; top: 19px; display: flex; gap: 9px; pointer-events: none; }
.lights i { width: 14px; height: 14px; border-radius: 50%; background: #ff5f57; box-shadow: inset 0 0 0 .5px rgb(0 0 0 / .15); }
.lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
.win.unfocused .lights i { background: color-mix(in srgb, var(--text) 18%, transparent); }
.caps { position: absolute; z-index: 20; right: 0; top: 0; height: 40px; display: flex; color: var(--text); pointer-events: none; }
.caps i { width: 46px; display: grid; place-items: center; }
.caps svg { width: 10px; height: 10px; stroke: currentColor; stroke-width: 1; fill: none; }
.win.mac .caps, .win.winos .lights { display: none; }

/* Setup band: drag region in the product (-webkit-app-region: drag); its buttons are no-drag with exact hit boxes. */
.setup-bar { position: relative; height: 52px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 calc(12px + var(--inset-r)) 0 calc(16px + var(--inset-l)); }
.setup-bar .grow { flex: 1; min-width: 0; }
.setup-bar .later { color: var(--text-2); font-weight: 400; }
.win.winos .setup-bar .later { margin-right: 4px; }

/* Shared building blocks */
.mark { color: var(--text); display: block; }
.seg { display: inline-flex; height: 28px; padding: 2px; gap: 2px; border-radius: 8px; background: var(--frame); }
.seg label { position: relative; display: flex; }
.seg input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; margin: 0; }
.seg span { display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 12px; border-radius: 6px; color: var(--text-2); white-space: nowrap; }
.seg svg.icon { width: 15px; height: 15px; }
.seg input:checked + span { background: var(--frame-raised); box-shadow: var(--shadow-raised); color: var(--text); font-weight: 500; }
.seg input:focus-visible + span { outline: var(--focus-ring); outline-offset: var(--focus-offset); }
.seg label:has(input:not(:checked)):hover span { background: var(--frame-hover); color: var(--text); }

.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-weight: var(--fw-label); }
.field input, .field select { height: var(--h-field); width: 100%; }
.field small, .hint { color: var(--text-2); font-size: var(--fs-sm); line-height: 1.5; }
.inline-fields { display: grid; grid-template-columns: 140px 1fr 110px; gap: 10px; }

.choice { position: relative; display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border-radius: var(--r-card); box-shadow: inset 0 0 0 1px var(--line-strong); }
.choice:hover { background: var(--hover); }
.choice:has(input:checked) { box-shadow: inset 0 0 0 1.5px var(--accent); background: var(--accent-soft); }
.choice:has(input:focus-visible) { outline: var(--focus-ring); outline-offset: 2px; }
.choice input { margin-top: 2px; }
.choice .ci { width: 32px; height: 32px; flex: none; border-radius: 8px; display: grid; place-items: center; background: var(--sunken); color: var(--text-2); }
.choice .ci svg.icon { width: 17px; height: 17px; }
.choice .lb { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.choice .lb b { font-weight: var(--fw-title); }
.choice .lb small { color: var(--text-2); font-size: var(--fs-sm); line-height: 1.5; }

.stack { display: flex; flex-direction: column; gap: 10px; }
.idd { display: flex; flex-direction: column; gap: 16px; padding: 10px 0 4px 4px; }
.win { container-type: size; container-name: win; }
.note { display: flex; gap: 8px; align-items: flex-start; color: var(--text-2); font-size: var(--fs-sm); line-height: 1.5; }
.note svg.icon { width: 14px; height: 14px; margin-top: 2px; }

/* The fix panel: same look as .condition-fix in settings.css */
.fix { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding: 12px 16px; border-radius: var(--r-card); background: var(--sunken); color: var(--text-2); font-size: var(--fs-sm); }
.fix > .msg { flex: 1 1 260px; display: flex; gap: 10px; align-items: flex-start; line-height: 1.5; }
.fix > .msg svg.icon { margin-top: 1px; }
.fix > .msg b { color: var(--text); font-weight: var(--fw-title); display: block; font-size: var(--fs-body); }
.fix.bad > .msg > svg { color: var(--danger); } .fix.warn > .msg > svg { color: var(--warn); } .fix.good > .msg > svg { color: var(--ok); }
.fix .acts { display: flex; gap: 8px; flex-wrap: wrap; }

.nowline { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--r-card); box-shadow: inset 0 0 0 1px var(--sep); }
.nowline .label { flex: 1; display: flex; flex-direction: column; }
.nowline .label small { color: var(--text-2); font-size: var(--fs-sm); }
.nowline .sec { font-variant-numeric: tabular-nums; }
.live { display: flex; align-items: center; gap: 8px; color: var(--text-2); font-size: var(--fs-sm); }
.live .sec { font-variant-numeric: tabular-nums; }

/* Condition rows, the ConditionList shape grown for a full page */
.conds { display: flex; flex-direction: column; }
.cond { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 0; }
.cond + .cond { border-top: 1px solid var(--sep); }
.cond .cicon { width: 17px; height: 17px; color: var(--text-2); }
.cond .label { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.cond .label b { font-weight: var(--fw-label); }
.cond .label small { color: var(--text-2); font-size: var(--fs-sm); overflow-wrap: anywhere; }
.cond .cmark { width: 20px; display: grid; place-items: center; color: var(--text-3); }
.cond .cmark svg.icon { width: 18px; height: 18px; }
.cond.ok .cmark { color: var(--ok); } .cond.failed .cmark { color: var(--danger); } .cond.running .cmark { color: var(--warn); }
.cond.pending .label b, .cond.pending .cicon { color: var(--text-3); }
.cond.failed .label small { color: var(--danger); }

/* Node list, as .nodes.compact in settings.css */
.nodes { list-style: none; margin: 0; padding: 0; }
.nodes li { position: relative; }
.nodes.bounded { max-height: max(146px, calc(100cqh - var(--nodes-reserve, 430px))); overflow-y: auto; padding: 0 8px; margin: 0 -8px; }
.nodes li + li::after { content: ''; position: absolute; top: 0; left: 24px; right: 0; border-top: 1px solid var(--sep); }
.nodes li.sel::after, .nodes li.sel + li::after { opacity: 0; }
.nodes label { position: relative; z-index: 0; display: flex; align-items: center; gap: 10px; height: 36px; }
.nodes label::before { content: ''; position: absolute; inset: 2px -8px; z-index: -1; border-radius: var(--r-ctl); }
.nodes label:hover::before { background: var(--hover); }
.nodes li.sel label::before { background: var(--accent-soft); }
.nodes label:has(input:focus-visible)::before { outline: var(--focus-ring); }
.nodes input { position: absolute; opacity: 0; pointer-events: none; }
.nodes .mk { width: 14px; flex: none; display: grid; color: var(--accent); }
.nodes .mk svg.icon { width: 14px; height: 14px; stroke-width: 2.5; }
.nodes .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nodes li.sel .nm { font-weight: var(--fw-label); }
.nodes .ty, .nodes .dl { color: var(--text-2); font-size: var(--fs-sm); font-variant-numeric: tabular-nums; }
.nodes .dl { width: 52px; text-align: right; }

.srcline { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-card); box-shadow: inset 0 0 0 1px var(--sep); }
.srcline .label { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.srcline .label b { font-weight: var(--fw-title); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srcline .label small { color: var(--text-2); font-size: var(--fs-sm); }
.srcline > svg.icon { color: var(--text-2); }

.kv { display: flex; flex-direction: column; }
.kv .r { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 0; }
.kv .r + .r { border-top: 1px solid var(--sep); }
.kv .r > svg.icon { color: var(--text-2); }
.kv .r .label { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.kv .r .label small { color: var(--text-2); font-size: var(--fs-sm); }
.kv .r .val { text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
.kv .r .val small { color: var(--text-3); font-size: var(--fs-sm); }

details.more > summary { list-style: none; display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 4px; border-radius: var(--r-ctl); color: var(--accent); font-weight: var(--fw-label); }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary:hover { background: var(--hover); }
details.more > summary:focus-visible { outline: var(--focus-ring); outline-offset: var(--focus-offset); }
details.more > summary svg.icon { width: 14px; height: 14px; transition: transform var(--dur) var(--ease-out); }
details.more[open] > summary svg.icon { transform: rotate(90deg); }

.radio-row { display: flex; align-items: center; gap: 10px; min-height: 30px; }
.drop { display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: var(--r-card); box-shadow: inset 0 0 0 1px var(--line-strong); }
.drop .label { flex: 1; display: flex; flex-direction: column; }
.drop .label small { color: var(--text-2); font-size: var(--fs-sm); }

.badge { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--idle) 14%, transparent); color: var(--idle); }
.badge svg.icon { width: 20px; height: 20px; }
.badge.open { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
.badge.closed { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
.badge.checking { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); }

.resume { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: var(--r-ctl); background: var(--sunken); color: var(--text-2); font-size: var(--fs-sm); }
.resume svg.icon { width: 14px; height: 14px; }

.layout-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.layout-pick .choice { flex-direction: column; gap: 10px; }
.layout-pick .choice input { position: absolute; opacity: 0; }
.thumb { display: block; width: 100%; height: 56px; border-radius: 6px; background: var(--sunken); box-shadow: inset 0 0 0 1px var(--sep); position: relative; overflow: hidden; }
.thumb.top::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 16px; background: var(--frame); }
.thumb.side::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 26%; background: var(--frame); }
.pers { display: flex; flex-direction: column; gap: 0; }
.pers .r { display: flex; align-items: center; gap: 16px; min-height: 56px; padding: 10px 0; }
.pers .r + .r { border-top: 1px solid var(--sep); }
.pers .r .label { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.pers .r .label small { color: var(--text-2); font-size: var(--fs-sm); }
.pers .r.col { flex-direction: column; align-items: stretch; }

/* ---------- Normal browser window (for "set up later" and "done") ---------- */
.strip { height: 40px; flex: none; background: var(--frame); display: flex; align-items: flex-end; padding: 0 calc(8px + var(--inset-r)) 0 calc(8px + var(--inset-l)); }
.strip .tab { height: 32px; width: 220px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-radius: 10px 10px 0 0; background: var(--band); font-size: var(--fs-sm); }
.strip .tab svg.icon { width: 14px; height: 14px; color: var(--text-2); }
.toolbar { height: 45px; flex: none; background: var(--band); display: flex; align-items: center; gap: 4px; padding: 0 8px; border-bottom: 1px solid var(--sep); }
.toolbar .addr { flex: 1; height: 32px; border-radius: 999px; background: var(--band-field); display: flex; align-items: center; gap: 8px; padding: 0 14px; color: var(--text-3); margin: 0 6px; }
.toolbar .status { position: relative; display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; color: var(--text-2); }

    if (sim === 'core') { S.v.core = 'failed'; S.v.phase = 'core'; return; }
    S.v.core = 'ok'; S.v.link = 'running';
    later(500, () => {
      if (sim === 'port' && S.path === 'external') { S.v.link = 'failed'; S.v.phase = 'port'; return; }

      timers.push(setInterval(() => { S.v.sec++; if (sim === 'timeout' && S.v.sec >= 15) { clearTimers(); S.v.exit = 'failed'; S.v.phase = 'timeout'; } draw(); }, 250));

  });
}

function deriveStep(S) {
  const ext = S.path === 'external';
  if (!S.started) return 'welcome';
  if (ext ? !S.ext.port : !S.source) return ext ? 'port' : S.pathChosen ? 'source' : 'path';
  if ((!ext && !S.node) || !S.country) return 'node';
  if (S.v.phase !== 'ok') return 'verify';
  if (!S.identity) return 'identity';
  if (!S.personalDone) return 'personal';
  return 'browser';
}

const back = {
  path: 'welcome', source: 'path', port: 'path', node: () => S.path === 'external' ? 'port' : 'source',

};
function goBack() { clearTimers(); const b = back[S.step]; if (S.step === 'verify') S.v.phase = 'idle'; go(typeof b === 'function' ? b() : b); }

  ['done', '6 完成', { step: 'done', ...base, v: vOk, tz: 'Asia/Tokyo', identity: 'applied' }],
  ['reopen-verify', '重新打开 · 按真实状态回到核对', { step: 'verify', started: true, ...base, v: { phase: 'running', core: 'ok', link: 'ok', exit: 'running', sec: 1, ip: '', got: '' } }],
  ['later', '稍后设置 · 普通窗口', { step: 'later', card: true }],
  ['later-partial', '稍后设置 · 已导入节点', { step: 'later', card: true, ...base }],
  ['home', '完成后 · 主页，外网已放行', { step: 'home', ...base, v: vOk }],
];
function applyScene(id) {
  const sc = SCENES.find(s => s[0] === id); if (!sc) return;
  clearTimers();
  const sim = S.sim; S = Object.assign(fresh(), JSON.parse(JSON.stringify(sc[2]))); S.sim = sim; S.scene = id;
}

// ---------- Actions ----------
const ACTS = {
  start: () => go('path'), later: () => { clearTimers(); S.prev = S.step; S.step = 'later'; S.card = true; },
  resume: () => { S.card = false; const d = deriveStep(S); if (d === 'verify') startVerify(); else if (d === 'browser') S.step = 'home'; else S.step = d; },
  card: () => { S.card = !S.card; },
  back: goBack, next: () => ({ path: nextFromPath, port: () => go('node'), identity: () => { S.identity = 'applied'; go('personal'); }, personal: () => go('done'), done: () => { S.step = 'home'; }, verify: () => go('identity') }[S.step] || (() => {}))(),
  fetch: startFetch, cancelFetch: () => { clearTimers(); S.fetch = 'idle'; },
  tab: a => { S.tab = a; S.fetch = 'idle'; }, pickFile: () => { S.file = 'my-subscription.yaml'; },
  verify: startVerify, delays: () => { S.delays = true; },
  useObserved: () => { S.country = S.v.got; startVerify(); },
  keepIdentity: () => { S.identity = 'kept'; go('personal'); },
  skip: () => go('done'), go: a => { clearTimers(); go(a); },
  bookmarks: () => { S.bookmarks = '已导入 128 个书签'; },
  restart: () => { const sim = S.sim; S = fresh(); S.sim = sim; },
};

// ---------- Render loop ----------
const root = () => document.getElementById('win');
function draw() {
  const el = root(), a = document.activeElement, id = a && a.id, sel = a && 'selectionStart' in a ? [a.selectionStart, a.selectionEnd] : null;
  el.className = `win ${ENV.os === 'win' ? 'winos' : 'mac'}`;
  const chrome = `<div class="lights"><i></i><i></i><i></i></div><div class="caps"><i><svg viewBox="0 0 10 10"><path d="M0 5h10"/></svg></i><i><svg viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9"/></svg></i><i><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0 0 10"/></svg></i></div>`;
  el.innerHTML = chrome + (S.step === 'later' ? normalWindow('later') : S.step === 'home' ? normalWindow('home') : OPTION.render(S));
  OPTION.after?.();
  if (id) { const n = document.getElementById(id); if (n) { n.focus(); if (sel && 'setSelectionRange' in n) try { n.setSelectionRange(...sel); } catch {} } }
  const sc = document.getElementById('m-scene'); if (sc) sc.value = S.scene || '';
}
function setPath(obj, path, val) { const k = path.split('.'); let o = obj; while (k.length > 1) o = o[k.shift()]; o[k[0]] = val; }
function wire() {
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    e.preventDefault(); ACTS[b.dataset.act]?.(b.dataset.arg); draw();
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.set) { const k = t.dataset.set; S[k] = t.value; if (k === 'node' && S.path !== 'external') { const g = guessCountry(t.value); S.country = g; } if (k === 'tab') S.fetch = 'idle'; draw(); }
    else if (t.dataset.bind && t.tagName === 'SELECT') { setPath(S, t.dataset.bind, t.value); draw(); }
  });
  document.addEventListener('input', e => { const t = e.target; if (t.dataset.bind && t.tagName !== 'SELECT') { setPath(S, t.dataset.bind, t.value); if (t.dataset.bind === 'url') S.fetch = 'idle'; draw(); } });
  document.addEventListener('toggle', e => { const t = e.target; if (t.dataset && t.dataset.toggle) S[t.dataset.toggle] = t.open; }, true);
}
function harness() {
  document.documentElement.dataset.theme = ENV.theme;
  document.body.className = ENV.shot ? 'shot' : 'mock';
  const [w, h] = ENV.size === '800' ? [800, 560] : ENV.size === '720' ? [720, 480] : [1280, 800];
  document.documentElement.style.setProperty('--w', w + 'px'); document.documentElement.style.setProperty('--h', h + 'px');
  const bar = document.createElement('div'); bar.className = 'mockbar';
  bar.innerHTML = `<a href="index.html">← 总览</a><b>${OPTION.title}</b>
    <label>场景 <select id="m-scene"><option value="">（自由点击中）</option>${SCENES.map(s => `<option value="${s[0]}">${s[1]}</option>`).join('')}</select></label>
    <label>主题 <select id="m-theme"><option value="light">浅色</option><option value="dark">深色</option></select></label>
    <label>系统 <select id="m-os"><option value="mac">macOS</option><option value="win">Windows</option></select></label>
    <label>窗口 <select id="m-size"><option value="1280">1280×800</option><option value="800">800×560</option><option value="720">720×480（实际最小）</option></select></label>
    <label>演示：获取订阅 <select id="m-fetch"><option value="ok">成功</option><option value="failed">失败</option><option value="empty">没有节点</option></select></label>
    <label>核对 <select id="m-verify"><option value="ok">一致</option><option value="mismatch">不一致</option><option value="timeout">超时</option><option value="core">核心未运行</option><option value="port">本机端口无回应</option></select></label>
    <button class="btn" data-act="restart" style="height:24px">从头开始</button>`;
  document.body.prepend(bar);
  const m = id => document.getElementById(id);
  m('m-theme').value = ENV.theme; m('m-os').value = ENV.os; m('m-size').value = ENV.size;
  m('m-theme').onchange = e => { ENV.theme = e.target.value; document.documentElement.dataset.theme = ENV.theme; };
  m('m-os').onchange = e => { ENV.os = e.target.value; draw(); };
  m('m-size').onchange = e => { ENV.size = e.target.value; const [w, h] = ENV.size === '800' ? [800, 560] : ENV.size === '720' ? [720, 480] : [1280, 800]; document.documentElement.style.setProperty('--w', w + 'px'); document.documentElement.style.setProperty('--h', h + 'px'); };
  m('m-scene').onchange = e => { if (e.target.value) { applyScene(e.target.value); draw(); } };
  m('m-fetch').onchange = e => { S.sim.fetch = e.target.value; };
  m('m-verify').onchange = e => { S.sim.verify = e.target.value; };
}
window.addEventListener('DOMContentLoaded', () => { harness(); wire(); if (params.get('scene')) applyScene(params.get('scene')); draw(); });

const LABELS = ['欢迎', '连接', '核对出口', '身份', '个性化'];
const LABELS_EN = ['Welcome', 'Connect', 'Check exit', 'Identity', 'Personalise'];
// A step is marked done by the state it stands for, not by having been passed: "核对出口" is ticked only while the gate is open.
const doneMarks = S => [S.step !== 'welcome', S.path === 'external' ? !!S.ext.port && PHASE[S.step] >= 2 : !!S.source, S.v.phase === 'ok' && PHASE[S.step] >= 2, !!S.identity, S.step === 'done'];
function stepper(S) {
  const p = Math.min(PHASE[S.step], 4), labels = S.lang === 'en' && ['welcome', 'node', 'verify'].includes(S.step) ? LABELS_EN : LABELS, d = doneMarks(S);
  return `<ol class="steps" aria-label="${L('设置步骤', 'Setup steps')}">${labels.map((t, i) => { const cur = i === p && S.step !== 'done'; return `<li class="${cur ? 'cur' : d[i] ? 'done' : ''}" ${cur ? 'aria-current="step"' : ''}><span class="n">${!cur && d[i] ? ic('check') : i + 1}</span>${t}</li>`; }).join('')}</ol>
    <div class="steps-compact">${S.step === 'done' ? '' : L(`第 ${p + 1} 步，共 5 步`, `Step ${p + 1} of 5`)}<b>${S.step === 'done' ? L('完成', 'Done') : labels[p]}</b></div>`;
}
const OPTION = {
  title: '方案 A2 · 逐步引导（修订）',
  render(S) {
    const bar = `<div class="setup-bar"><span class="brand">${MARK(18)}<span>Anyu</span></span><div class="grow">${stepper(S)}</div>${S.step === 'done' ? '' : `<button class="btn quiet later" data-act="later">${L('稍后设置', 'Set up later')}</button>`}</div>`;
    if (S.step === 'welcome') return bar + `<div class="welcome">${MARK(56)}<h1 class="name">Anyu</h1>
      <p class="line">${B.welcomeLine()}</p>
      <div class="ctl">${B.langSeg()}<button class="btn primary lg" data-act="start" autofocus>${L('开始', 'Get started')}${ic('arrow-right')}</button></div></div>`;
    let title = '', body = '', primary = '', secondary = '', backLabel = L('上一步', 'Back'), center = false;
    const v = S.v;
    switch (S.step) {
      case 'path': title = '你怎么连接代理？'; body = B.path(); primary = `<button class="btn primary" data-act="next">下一步</button>`; break;
      case 'source': title = '添加节点'; body = B.sourceTabs() + B.sourceInput() + B.sourceState();
        primary = `<button class="btn primary" data-act="fetch" ${B.sourceReady() ? '' : 'disabled'}>${B.sourcePrimary()}</button>`; break;
      case 'port': title = '本机代理软件的端口'; body = B.port(); primary = `<button class="btn primary" data-act="next" ${S.ext.port ? '' : 'disabled'}>下一步</button>`; break;
      case 'node': {
        const s = srcInfo();
        title = S.path === 'external' ? L('出口国家', 'Exit country') : L('选择节点和出口国家', 'Choose a node and exit country');
        const detail = esc(s.detail.replace(/ · 未发网络请求| · no network request/, ''));
        body = (S.path === 'external'
          ? `<div class="srcline">${ic(s.icon)}<div class="label"><b>${esc(s.title)}</b><small>${detail}</small></div><button class="btn link" data-act="back">${L('修改', 'Edit')}</button></div>`
          : `<div class="listhead"><span class="src">${ic(s.icon)}<b>${esc(s.title)}</b><span>${detail}</span></span><span class="acts"><button class="btn link" data-act="back">${L('更换来源', 'Change source')}</button>${B.delayBtn()}</span></div>${B.nodeList()}`) + B.countryField();
        primary = `<button class="btn primary" data-act="verify" ${S.country && (S.node || S.path === 'external') ? '' : 'disabled'}>${L('核对出口', 'Check exit')}</button>`; break; }
      case 'verify':
        title = v.phase === 'running' ? L('正在核对出口', 'Checking the exit') : v.phase === 'ok' ? L('出口已核对', 'Exit checked') : L('没有通过核对', 'The check did not pass');
        body = B.condRows() + B.verifyResult();
        primary = v.phase === 'ok' ? `<button class="btn primary" data-act="next">${L('下一步', 'Next')}</button>` : '';
        backLabel = v.phase === 'running' ? L('停止并返回', 'Stop and go back') : L('上一步', 'Back'); break;
      case 'identity': title = `让时区和语言与${esc(cname(S.country))}一致`; body = B.identityRows() + B.identityDetails();
        secondary = `<button class="btn quiet" data-act="keepIdentity">保留现在的设置</button>`; primary = `<button class="btn primary" data-act="next">使用这些设置</button>`; break;
      case 'personal': title = '个性化'; body = B.personal();
        secondary = `<button class="btn quiet" data-act="skip">跳过</button>`; primary = `<button class="btn primary" data-act="next">完成</button>`; break;
      case 'done': center = true;
        body = `<div class="done-screen"><span class="badge open">${ic('shield-check')}</span><h1>设置完成</h1><p class="fact">外网已放行 · ${esc(cname(S.country))}</p><p class="note">${ic('shield')}<span>出口一旦不一致，外网立即关闭，工具栏的盾牌会变红。</span></p></div>`;
        primary = `<button class="btn primary" data-act="next" autofocus ${v.phase === 'ok' ? '' : 'disabled'}>开始浏览</button>`; break;
    }
    return bar + `<main class="a-main${center ? ' center' : ''}"><div class="a-col">${title ? `<h1>${title}</h1>` : ''}${body}</div></main>
      <footer class="a-foot"><div class="a-col"><button class="btn" data-act="back">${ic('arrow-left')}${backLabel}</button><span class="grow"></span>${secondary}${primary}</div></footer>`;
  },
};
</script></body></html>
